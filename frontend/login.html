<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — GigShield AI</title>
    <meta name="description" content="Login to your GigShield AI dashboard to manage your income insurance policy.">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand"><div class="shield-icon">🛡️</div> GigShield AI</a>
        <button class="hamburger"><span></span><span></span><span></span></button>
        <div class="navbar-links" id="nav-right">
            <a href="/">Home</a>
            <a href="/login" class="active">Login</a>
            <a href="/register" class="btn btn-primary btn-sm">Register</a>
        </div>
    </nav>

    <div style="background:var(--bg-light);min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:2rem;">
        <div class="card fade-in" style="max-width:440px;width:100%;border-radius:var(--radius-lg);">
            <div class="card-body" style="padding:2.5rem;">
                <div style="text-align:center;margin-bottom:2rem;">
                    <div style="font-size:2.5rem;margin-bottom:0.5rem;">🛡️</div>
                    <h1 style="font-size:1.5rem;font-weight:700;">Welcome Back</h1>
                    <p style="color:var(--text-light);font-size:0.9rem;">Login to your GigShield AI account</p>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-full" id="login-btn">Login</button>
                </form>

                <div style="text-align:center;margin-top:1.5rem;">
                    <p style="font-size:0.85rem;color:var(--text-light);">
                        Don't have an account? <a href="/register" style="color:var(--primary);font-weight:600;">Register here</a>
                    </p>
                </div>


            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.textContent = 'Logging in...';
            btn.disabled = true;
            try {
                const data = await apiPost('/api/login', {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });
                setToken(data.token);
                setUser(data.user);
                showToast('Login successful!', 'success');
                setTimeout(() => {
                    window.location.href = data.user.is_admin ? '/admin' : '/dashboard';
                }, 500);
            } catch (err) {
                showToast(err.message, 'error');
                btn.textContent = 'Login';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
